<div class="poster">
  <div class="layer1">

    <div class="dash"></div>

    <div class="kicker">装配式建筑应用系列研究 · 技术分析报告</div>
    <div class="hero"><span class="hero-accent">双T板</span><br>在仓储物流厂房<br>中的应用优势</div>
    <div class="summary">双T板以板梁合一的截面效率与工厂预制的建造方式，为仓储物流厂房提供大跨度无柱空间、更强承载、更快工期与更低的全寿命成本。本报告结合高标仓、自动化立体库、冷链物流与屋顶光伏等当前典型场景，系统梳理其核心优势、技术参数与选型实施要点。</div>
