<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bitcoin Miner Earn Real Crypto (Decompiled)</title>
<!-- Mobile fullscreen / no-zoom metas (preserved from original) -->
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,minimal-ui=true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="msapplication-tap-highlight" content="no">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="360-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<style>
  html { -ms-touch-action: none; }
  body, canvas, div {
    display: block; outline: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    user-select: none; -webkit-user-select: none;
  }
  body {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    padding: 0; border: 0; margin: 0;
    cursor: default; color: #888; background-color: #333;
    text-align: center;
    font-family: Helvetica, Verdana, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  canvas { background-color: rgba(0,0,0,0); }
  #GameDiv, #Cocos3dGameContainer, #GameCanvas { width: 100%; height: 100%; }
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-right: env(safe-area-inset-right);
    --safe-bottom: env(safe-area-inset-bottom);
    --safe-left: env(safe-area-inset-left);
  }
</style>
</head>
<body>
<div id="GameDiv" cc_exact_fit_screen="true">
  <div id="Cocos3dGameContainer">
    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
  </div>
</div>

<!--
  ====================================================================
  Local Cocos Creator 3.7.4 web-mobile bootstrap.
  The original Mintegral single-file ad loaded everything from an
  in-memory zlib+base64 blob (window.__adapter_zip__). That adapter
  layer is removed here; Cocos loads its standard build outputs
  directly from the local filesystem, so every asset under assets/
  can be inspected and replaced individually.
  ====================================================================
-->

<!-- 1. Polyfills (Promise, fetch shims, etc.) -->
<script src="assets/src/polyfills.bundle.js"></script>
<!-- 2. SystemJS module loader -->
<script src="assets/src/system.bundle.js"></script>
<!-- 3. Import map: the bare specifier "cc" -> local Cocos engine -->
<script type="systemjs-importmap">{"imports":{"cc":"./assets/cocos-js/cc.js"}}</script>

<script>
  // Minimal adapter shims so the original index.js / application.js run
  // unchanged: they call System.import('cc') then bootstrap the game.
  // (No resource interception — assets load over plain HTTP from assets/.)
  (function () {
    var canvas = document.getElementById('GameCanvas');
    var bcr = canvas.parentElement.getBoundingClientRect();
    canvas.width = bcr.width;
    canvas.height = bcr.height;

    // Load engine first, then the application entry, then start.
    System.import('cc').then(function () {
      return System.import('./assets/index.js');
    })["catch"](function (err) { console.error(err); });
  })();
</script>
</body>
</html>
