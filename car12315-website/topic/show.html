<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>吐槽详情-车言槽</title>
    <link rel="stylesheet" href="../vendor/css/font-awesome.min.css">
    <link rel="stylesheet" href="../vendor/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div data-header></div>

<div class="container site-main">
    <div class="block crumbs">
        <div id="breadcrumb"></div>
    </div>

    <!-- 吐槽详情 -->
    <div class="block">
        <div id="sec-head"></div>
        <div class="detail-view"></div>
    </div>

    <!-- 评论 -->
    <div class="block">
        <div class="sec-head">
            <span class="sec-icon co-blue"><i class="fa fa-commenting-o"></i></span>
            <div class="sec-titles">
                <h2>网友评论 <span class="comment-count"></span></h2>
                <p>车友互动 · 畅所欲言</p>
            </div>
        </div>
        <div class="comment-view"></div>
    </div>
</div>

<div data-footer></div>

<script src="../assets/js/app.js"></script>
<script>
    App.header('topic');
    App.footer();
    document.getElementById('breadcrumb').innerHTML = App.breadcrumb([
        { name: '首页', href: 'index.html' },
        { name: '吐槽', href: 'topic/index.html' },
        { name: '详情' }
    ]);
    document.getElementById('sec-head').innerHTML = App.sectionHead({
        iconCls: 'co-green', icon: 'fa-comments-o', title: '吐槽详情'
    });

    var detailView = document.querySelector('.detail-view');
    var commentView = document.querySelector('.comment-view');
    var id = App.qs('id');

    function render(item) {
        if (!item) { detailView.innerHTML = App.empty('信息不存在'); return; }
        var images = '';
        if (item.images && item.images.length) {
            images = '<div class="field-label">配图</div>' +
                '<div class="image-list">' +
                item.images.map(function (img) {
                    return '<a href="' + App.esc(img) + '" data-lightbox="topic-box">' +
                        '<img loading="lazy" src="' + App.esc(img) + '" data-fallback="' + App.esc(App.IMG.cms) + '"></a>';
                }).join('') +
                '</div><div class="image-tip"><i class="fa fa-search-plus"></i> 点击图片可放大查看</div>';
        }
        detailView.innerHTML =
            '<div class="title">' + App.esc(item.title) + '</div>' +
            '<div class="info">' +
            App.avatarHtml(item.userinfo, 'avatar') +
            '<span>' + App.esc(item.userinfo && item.userinfo.nickname) + '</span>' +
            '<span class="flex-fill"></span>' +
            '<span><i class="fa fa-clock-o"></i> ' + App.fmtDate(item.created) + '</span>' +
            '<span><i class="fa fa-commenting-o"></i> 评论 ' + (item.cnt || 0) + '</span>' +
            '</div>' +
            '<div class="content">' + App.esc(item.content || '无正文内容') + '</div>' +
            images;
    }

    if (!id) {
        detailView.innerHTML = App.empty('缺少吐槽ID参数');
    } else {
        detailView.innerHTML = App.loading();
        App.request('/api/topic/get', { topicId: id })
            .then(render)
            .catch(function (err) { detailView.innerHTML = App.empty('吐槽加载失败：' + err.message); });

        // 评论列表(AJAX分页)
        App.comments(commentView, '/api/topic/comment/list', { topicId: id });
    }
</script>
</body>
</html>
